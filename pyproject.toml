[project]
name = "pageindex-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.0",
    "duckduckgo-search>=8.1.1",
    "edge-tts>=7.3.1",
    "fastapi>=0.136.1",
    "fastmcp>=4.1.0",
    "huggingface-hub>=2.1.1",
    "mcp>=2.3.0",
    "openai>=2.36.0",
    "pageindex>=0.2.8",
    "psycopg2-binary>=2.9.13",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.28",
    "uvicorn>=0.46.0",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["app", "."]
