version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: rag_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_pageindex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_pageindex"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: rag_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/rag_pageindex
    env_file:
      - .env
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
